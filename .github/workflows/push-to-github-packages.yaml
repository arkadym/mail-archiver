name: Publish Docker image to GHCR

# Fork versioning: upstream uses YYMM.N (e.g. 2604.2)
# This fork appends a build suffix: YYMM.N.X (e.g. 2604.2.1)
# so it is always clear which upstream release a fork image is based on.
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*'   # matches 2604.2.1, 2605.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag in fork format (e.g., 2604.2.1)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/mail-archiver:${{ steps.version.outputs.value }}
            ghcr.io/${{ secrets.GHCR_USERNAME }}/mail-archiver:latest
